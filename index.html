<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Плюшевый 3D Арканоид — Тактильное Издание</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #3b1334 0%, #160514 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff0f6;
        }
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 24px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(45, 14, 40, 0.72);
            backdrop-filter: blur(10px);
            padding: 12px 22px;
            border-radius: 26px;
            border: 2px dashed rgba(255, 164, 199, 0.45);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 0 15px rgba(255, 126, 167, 0.15);
            pointer-events: auto;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 12px;
        }
        .hud-stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            align-items: center;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 16px;
        }
        .stat-badge span {
            color: #ff8fb6;
            font-size: 19px;
        }
        .hud-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn, select.btn {
            background: linear-gradient(145deg, #ff7ea7, #e05383);
            color: #ffffff;
            border: 2px solid #ffc2d8;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 151, 0.4);
            transition: transform 0.15s ease, filter 0.15s ease;
            outline: none;
        }
        select.btn option {
            background: #270d22;
            color: #fff0f6;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(1px) scale(0.97);
        }
        .hud-bottom {
            text-align: center;
            padding-bottom: 8px;
        }
        .level-banner {
            display: inline-block;
            background: rgba(39, 13, 34, 0.78);
            border: 2px dashed rgba(255, 194, 216, 0.5);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 15px;
            color: #ffd1e1;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        #overlay-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(42, 12, 37, 0.94);
            backdrop-filter: blur(14px);
            border: 3px dashed #ff8fb6;
            border-radius: 34px;
            padding: 36px 46px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(255, 126, 167, 0.22);
            pointer-events: auto;
            z-index: 10;
            max-width: 480px;
            width: 90%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #overlay-modal.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -45%) scale(0.92);
        }
        #overlay-modal h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #ffb3ce;
            text-shadow: 0 3px 12px rgba(255, 107, 151, 0.6);
        }
        #overlay-modal p {
            font-size: 16px;
            line-height: 1.5;
            color: #ffe3ee;
            margin-bottom: 26px;
        }
        .btn-large {
            font-size: 18px;
            padding: 13px 34px;
            border-radius: 24px;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-layer">
    <div class="hud-top">
        <div class="hud-stats">
            <div class="stat-badge">Счет: <span id="score-val">0</span></div>
            <div class="stat-badge">Жизни: <span id="lives-val">♥♥♥</span></div>
            <div class="stat-badge">Уровень: <span id="level-val">1 / 5</span></div>
        </div>
        <div class="hud-controls">
            <select id="diff-select" class="btn" title="Выбор сложности">
                <option value="easy">Мягкий (Легко)</option>
                <option value="normal" selected>Уютный (Норма)</option>
                <option value="hard">Бодрый (Сложно)</option>
            </select>
            <button id="btn-level" class="btn">Сменить узор</button>
            <button id="btn-audio" class="btn">🎵 Синтезатор: ВКЛ</button>
        </div>
    </div>

    <div class="hud-bottom">
        <div class="level-banner" id="fabric-title">Ткань уровня: Королевский Бархат • Нажмите или кликните для запуска</div>
    </div>
</div>

<div id="overlay-modal">
    <h1 id="modal-title">Плюшевый Арканоид</h1>
    <p id="modal-desc">Тактильный 3D-мир из мягкого бархата, вязаной шерсти, вельвета и атласа со встроенным полифоническим WebAudio-синтезатором.</p>
    <button id="modal-btn" class="btn btn-large">Начать игру</button>
</div>
