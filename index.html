<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромир Bot</title>
  <style>
    /* --- СТИЛИ (Дизайн) --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 10% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 40%),
                  radial-gradient(circle at 90% 85%, rgba(192, 132, 252, 0.25) 0%, transparent 50%),
                  #fdf2f8;
      color: #4a044e;
      height: 100vh;
      height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: #ffffff; border-bottom: 1px solid #fbcfe8;
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: #fce7f3; border: 1px solid #f9a8d4;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .title { font-weight: 800; font-size: 15px; color: #500724; }
    .subtitle { font-size: 11px; color: #9d174d; font-weight: 600; }
    .header-btns { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      background: #fce7f3; border: 1px solid #f9a8d4; color: #831843;
      border-radius: 10px; padding: 6px 10px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      transition: background 0.2s;
    }
    .icon-btn:active { background: #fbcfe8; }
    main {
      flex: 1; max-width: 680px; width: 100%; margin: 0 auto;
      padding: 10px; display: flex; flex-direction: column; min-height: 0;
    }
    .chat-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #fbcfe8; border-radius: 20px;
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.08);
    }
    #chat-stream {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg-row-bot { display: flex; align-items: flex-start; gap: 8px; max-width: 88%; }
    .msg-row-user { display: flex; justify-content: flex-end; }
    .bot-avatar {
      width: 32px; height: 32px; border-radius: 10px;
      background: #fce7f3; border: 1px solid #fbcfe8;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .bubble-bot {
      background: #ffffff; border: 1px solid #f9a8d4;
      border-radius: 16px; border-top-left-radius: 4px;
      padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #500724;
      word-wrap: break-word;
    }
    .bubble-user {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #ffffff; border-radius: 16px; border-top-right-radius: 4px;
      padding: 12px 14px; font-size: 14px; line-height: 1.45; max-width: 85%;
      word-wrap: break-word;
    }
    #typing-box {
      padding: 6px 16px; font-size: 12px; color: #be185d;
      display: none; align-items: center; gap: 6px; font-weight: 600;
    }
    .quick-bar {
      padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto;
      background: #fdf2f8; border-top: 1px solid #fce7f3; flex-shrink: 0;
    }
    .quick-bar::-webkit-scrollbar { height: 4px; }
    .quick-bar::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 999px;
      background: #ffffff; border: 1px solid #f9a8d4;
      font-size: 12px; color: #831843; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { background: #fce7f3; }
    .input-area {
      padding: 10px; background: #ffffff; border-top: 1px solid #fbcfe8; flex-shrink: 0;
    }
    .input-form { display: flex; align-items: center; gap: 8px; }
    #user-input {
      flex: 1; background: #fdf2f8;
      border: 1px solid #f9a8d4; border-radius: 14px;
      padding: 10px 14px; font-size: 14px; color: #500724;
      outline: none; font-family: inherit;
    }
    #user-input:focus { border-color: #ec4899; background: #ffffff; }
    .send-btn {
      width: 44px; height: 42px; border-radius: 14px;
      background: #db2777; color: #ffffff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-size: 16px; transition: background 0.2s;
    }
    .send-btn:hover { background: #be185d; }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="title">Электромир Bot</div>
        <div class="subtitle">AI Консультант 2.0</div>
      </div>
    </div>
    <div class="header-btns">
      <button type="button" class="icon-btn" id="voice-btn">
        <span id="voice-icon">🔊</span>
      </button>
      <button type="button" class="icon-btn" id="reload-btn" title="Сбросить диалог">🔄</button>
    </div>
  </header>

  <main>
    <div class="chat-card">
      <div id="chat-stream">
        <div class="msg-row-bot">
          <div class="bot-avatar">⚡</div>
          <div class="bubble-bot">
            Привет! Я консультант <b>«Электромира»</b> 🌸. Расскажу про удаление волос навсегда без боли. Что вас интересует?
          </div>
        </div>
      </div>

      <div id="typing-box">⏳ Печатаю ответ...</div>

      <div class="quick-bar" id="quick-bar">
        <button type="button" class="chip" data-q="Это больно?">🌸 Ощущения</button>
        <button type="button" class="chip" data-q="Сколько стоит?">💳 Цены</button>
        <button type="button" class="chip" data-q="Точно навсегда?">⚡ Гарантия</button>
        <button type="button" class="chip" data-q="Зоны и бикини">✨ Зоны</button>
      </div>

      <div class="input-area">
        <form id="chat-form" class="input-form">
          <input type="text" id="user-input" placeholder="Напишите вопрос..." autocomplete="off">
          <button type="submit" class="send-btn">➤</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // --- НАСТРОЙКИ ---
      var HF_TOKEN = "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"; 
      var SYSTEM_PROMPT = "Ты — девушка-администратор студии «Электромир». Твоя цель — записать клиента. 1. Электроэпиляция — удаление волос НАВСЕГДА (FDA). 2. Мы делаем ВСЕ зоны (бикини, лицо, тело). 3. Отвечай кратко (до 2 предложений), живо, меняй формулировки, используй разные эмодзи (🌸, ✨, ⚡).";
      
      // Инициализация памяти диалога
      var chatHistory = []; 

      var isVoiceActive = true;
      var synth = window.speechSynthesis || null;

      // Элементы
      var chatStream = document.getElementById("chat-stream");
      var typingBox = document.getElementById("typing-box");
      var chatForm = document.getElementById("chat-form");
      var userInput = document.getElementById("user-input");
      var voiceBtn = document.getElementById("voice-btn");
      var voiceIcon = document.getElementById("voice-icon");
      var reloadBtn = document.getElementById("reload-btn");
      var quickBar = document.getElementById("quick-bar");

      // Принудительная подгрузка голосов
      if (synth && synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = function() { synth.getVoices(); };
      }

      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function formatHTML(str) {
        return String(str || "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
          .replace(/\n/g, "<br>");
      }

      // --- УЛУЧШЕННАЯ ОЗВУЧКА ---
      function speak(text) {
        if (!isVoiceActive || !synth) return;
        try {
          synth.cancel();
          var clean = String(text).replace(/<[^>]*>/g, "").replace(/[#*_~`]/g, "").substring(0, 300);
          var utter = new SpeechSynthesisUtterance(clean);
          var voices = synth.getVoices() || [];
          
          // Поиск лучшего русского голоса
          var bestVoice = voices.find(function(v) { return v.name.includes("Google") && v.lang.includes("ru"); }) 
                       || voices.find(function(v) { return v.lang.includes("ru"); });
          
          if (bestVoice) utter.voice = bestVoice;
          
          utter.lang = "ru-RU";
          utter.rate = 0.95; // Чуть медленнее = естественнее
          utter.pitch = 1.1; // Немного повыше (женственнее)
          
          synth.speak(utter);
        } catch (e) {
          console.error(e);
        }
      }

      // --- ВАРИАТИВНЫЕ ОТВЕТЫ ---
      function getVariedReply(trigger) {
        var t = trigger.toLowerCase();
        
        var painReplies = [
          "Всё терпимо! 🌸 Мы используем отличную анестезию, многие девочки даже дремлют.",
          "Ощущения есть, но это не больно. С нашим обезболивающим кремом вы почувствуете только легкое тепло ✨.",
          "Совсем не бойтесь! Для чувствительных зон (бикини) у нас есть аппликационная анестезия. ⚡"
        ];
        
        var priceReplies = [
          "У нас честная поминутная оплата: <b>35-40 ₽/мин</b>. Вы платите только за чистое время работы мастера! 💳",
          "Прайс простой: тело <b>35 ₽/мин</b>, бикини <b>40 ₽/мин</b>. Плюс 150 ₽ за индивидуальную иголочку. Записать вас? 🌸",
          "Минута стоит от 35 рублей. На первой процедуре волос больше, но с каждым разом сеанс будет короче и дешевле! ✨"
        ];

        var foreverReplies = [
          "Да! Это единственный метод в мире с пожизненной гарантией (стандарт FDA). ⚡",
          "Абсолютно. В отличие от лазера, электроэпиляция убирает волос раз и навсегда. Даже пушковый! 🌸",
          "Конечно! Пройдя курс, вы забудете о бритве на всю жизнь. Это научный факт. ✨"
        ];

        if (t.includes("бол") || t.includes("ощущ")) return pickRandom(painReplies);
        if (t.includes("цен") || t.includes("стои") || t.includes("прайс")) return pickRandom(priceReplies);
        if (t.includes("навсегда") || t.includes("гарант")) return pickRandom(foreverReplies);
        
        return null; 
      }

      async function fetchAIResponse(userText) {
        // 1. Проверяем локальную базу
        var localReply = getVariedReply(userText);
        // С вероятностью 30% пропускаем локальный ответ, чтобы ИИ мог придумать что-то новое
        if (localReply && Math.random() > 0.3) {
          await new Promise(function(r) { setTimeout(r, 600); });
          return localReply;
        }

        // 2. Добавляем в историю
        chatHistory.push({ role: "user", content: userText });
        var contextMessages = [{ role: "system", content: SYSTEM_PROMPT }].concat(chatHistory.slice(-6));

        try {
          var response = await fetch("https://huggingface.co", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + HF_TOKEN,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              messages: contextMessages,
              max_tokens: 150,
              temperature: 0.8 
            })
          });

          if (!response.ok) throw new Error("API Error");
          var data = await response.json();
          var aiText = "";

          // Обработка разных форматов API
          if (data.choices && data.choices[0]) {
             aiText = data.choices[0].message.content.trim();
          } else if (data.generated_text) {
             aiText = data.generated_text;
          } else if (Array.isArray(data) && data[0] && data[0].generated_text) {
             aiText = data[0].generated_text;
          }

          if (!aiText) aiText = "Я вас услышала, но связь прерывается. Повторите, пожалуйста! 🌸";

          chatHistory.push({ role: "assistant", content: aiText });
          return aiText;

        } catch (err) {
          console.warn(err);
          return localReply || "Что-то связь барахлит 🌸. Но я точно знаю: электроэпиляция — это лучшее решение! Записать вас?";
        }
      }

      function appendMessage(text, isUser) {
        var row = document.createElement("div");
        row.className = isUser ? "msg-row-user" : "msg-row-bot";
        var bubble = document.createElement("div");
        bubble.className = isUser ? "bubble-user" : "bubble-bot";
        bubble.innerHTML = formatHTML(text);
        if (!isUser) {
          var avatar = document.createElement("div");
          avatar.className = "bot-avatar";
          avatar.textContent = "⚡";
          row.appendChild(avatar);
        }
        row.appendChild(bubble);
        chatStream.appendChild(row);
        chatStream.scrollTop = chatStream.scrollHeight;
      }

      async function handleSend(text) {
        var query = String(text || "").trim();
        if (!query) return;

        userInput.value = "";
        appendMessage(query, true);

        typingBox.style.display = "flex";
        chatStream.scrollTop = chatStream.scrollHeight;

        var reply = await fetchAIResponse(query);

        typingBox.style.display = "none";
        appendMessage(reply, false);
        speak(reply);
      }

      chatForm.addEventListener("submit", function(e) { e.preventDefault(); handleSend(userInput.value); });
      
      quickBar.addEventListener("click", function(e) {
        if (e.target.classList.contains("chip")) handleSend(e.target.getAttribute("data-q"));
      });

      voiceBtn.addEventListener("click", function() {
        isVoiceActive = !isVoiceActive;
        voiceIcon.textContent = isVoiceActive ? "🔊" : "🔇";
        if (!isVoiceActive && synth) synth.cancel();
      });

      reloadBtn.addEventListener("click", function() {
        if (synth) synth.cancel();
        chatStream.innerHTML = "";
        chatHistory = [];
        appendMessage("Привет! Я консультант <b>«Электромира»</b> 🌸. Расскажу про удаление волос навсегда без боли. Что вас интересует?", false);
      });

    })();
  </script>
</body>
</html>
