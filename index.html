<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромир Bot</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #fdf2f8; color: #3b0764; }
    .font-brand { font-family: 'Comfortaa', cursive, sans-serif; }
    .bg-canvas { background: radial-gradient(circle at 10% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 40%), radial-gradient(circle at 90% 85%, rgba(192, 132, 252, 0.25) 0%, transparent 50%), #fdf2f8; }
    .bubble-bot { background: #ffffff; border: 1px solid rgba(244, 114, 182, 0.35); box-shadow: 0 4px 15px rgba(219, 39, 119, 0.05); }
    .bubble-user { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: #ffffff; box-shadow: 0 4px 14px rgba(219, 39, 119, 0.25); }
    .wave-bar { animation: wavePulse 0.8s ease-in-out infinite; }
    @keyframes wavePulse { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 9999px; }
  </style>
</head>
<body class="bg-canvas h-[100dvh] flex flex-col justify-between overflow-hidden">
  <header class="bg-white/90 backdrop-blur-md border-b border-pink-200 px-3 py-2 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-pink-100 flex items-center justify-center text-lg border border-pink-300">⚡</div>
      <div>
        <h1 class="font-brand font-bold text-sm text-pink-950">Электромир Bot</h1>
        <p class="text-[10px] text-pink-800/60 font-semibold">AI Консультант + Голос Ирины</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleVoice()" id="voice-btn" class="px-2.5 py-1.5 rounded-xl bg-pink-100 text-pink-900 border border-pink-300 text-xs flex items-center gap-1.5 active:scale-95 transition">
        <i data-lucide="volume-2" id="voice-icon" class="w-4 h-4 text-pink-600"></i>
        <div id="voice-wave" class="hidden flex items-center gap-0.5 h-3.5">
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar" style="animation-delay:0.2s"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar" style="animation-delay:0.4s"></span>
        </div>
      </button>
      <button onclick="location.reload()" class="p-2 rounded-xl text-pink-800 hover:bg-pink-100 transition"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-2 flex flex-col min-h-0 z-10">
    <div class="bg-white/80 backdrop-blur-md rounded-3xl flex-1 flex flex-col border border-pink-200 shadow-lg overflow-hidden min-h-0">
      <div id="chat-stream" class="flex-1 overflow-y-auto p-3.5 space-y-4">
        <div class="flex items-start gap-2 max-w-[88%]">
          <div class="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center text-sm border border-pink-200 shrink-0">⚡</div>
          <div class="bubble-bot rounded-2xl rounded-tl-sm p-3.5 text-xs sm:text-sm text-pink-950">
            Привет! Я помощница из <b>«Электромира»</b> 🌸. Готова рассказать всё об электроэпиляции или просто поболтать о жизни. Что вас интересует?
          </div>
        </div>
      </div>
      <div id="typing-box" class="hidden px-4 py-1.5 flex items-center gap-1.5 text-xs text-pink-700/70">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
        <span>Печатаю ответ...</span>
      </div>
      <div class="p-2 sm:p-2.5 bg-white border-t border-pink-200">
        <form onsubmit="handleSend(event)" class="flex items-end gap-1.5">
          <textarea id="user-input" rows="1" placeholder="Спросите меня о чём угодно..." class="flex-1 resize-none bg-pink-50/50 border border-pink-300 rounded-2xl py-2.5 px-3 text-xs sm:text-sm text-pink-950 focus:outline-none focus:border-pink-500" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); handleSend(event);}"></textarea>
          <button type="submit" class="h-10 w-10 rounded-2xl bg-pink-600 text-white flex items-center justify-center shadow-md active:scale-95 transition shrink-0"><i data-lucide="send" class="w-4 h-4"></i></button>
        </form>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const HF_TOKEN = "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";
    const ROUTER_URL = "https://router.huggingface.co/v1/chat/completions";
    const LEGACY_URL = "https://huggingface.co";
    
    const SYSTEM_PROMPT = `Ты — живая, вежливая и экспертная девушка-консультант студии «Электромир».
    1. Электроэпиляция — ЕДИНСТВЕННЫЙ метод удаления волос НАВСЕГДА (стандарт FDA).
    2. Мы работаем на ВСЕХ зонах (лицо, тело, глубокое бикини).
    3. Отвечай кратко, используй эмодзи 🌸, выделяй важное жирным шрифтом.
    4. Если спрашивают не про волосы — поддерживай диалог как милая подруга.`;

    let isVoiceActive = true;
    const synth = window.speechSynthesis;

    function getVoice() {
      if (!synth) return null;
      const voices = synth.getVoices();
      return voices.find(v => v.lang.includes('ru') && (v.name.includes('Irina') || v.name.includes('Elena') || v.name.includes('Google'))) || voices.find(v => v.lang.includes('ru'));
    }

    function speak(text) {
      if (!isVoiceActive || !synth) return;
      synth.cancel();
      const cleanText = text.replace(/[#*_~`>]/g, '').substring(0, 250);
      const utterance = new SpeechSynthesisUtterance(cleanText);
      const voice = getVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = 'ru-RU';
      utterance.rate = 1.0;
      document.getElementById('voice-wave').classList.remove('hidden');
      utterance.onend = () => document.getElementById('voice-wave').classList.add('hidden');
      utterance.onerror = () => document.getElementById('voice-wave').classList.add('hidden');
      synth.speak(utterance);
    }

    // Локальная база ответов на случай, если токен заблокирован или нет интернета
    function getLocalAnswer(q) {
      const lower = q.toLowerCase();
      if (lower.includes('привет') || lower.includes('здравств')) {
        return "Привет-привет! 🌸 Очень рада вас видеть! Рассказать вам, как избавиться от лишних волосков **навсегда**, или просто поболтаем?";
      }
      if (lower.includes('больно') || lower.includes('боль') || lower.includes('обезбол')) {
        return "Ощущения зависят от вашего порога чувствительности 🌸. Но не переживайте! Можно нанести **обезболивающий крем** (например, Акриол Про или Эмла) под плёнку за час до процедуры, и всё пройдёт максимально комфортно!";
      }
      if (lower.includes('цен') || lower.includes('стоим') || lower.includes('сколько стоит')) {
        return "В студии **«Электромир»** оплата поминутная — вы платите только за чистое время работы мастера 🌸. Напишите, какая зона вас интересует (лицо, подмышки, бикини, ножки), и я сориентирую подробнее!";
      }
      if (lower.includes('навсегда') || lower.includes('лазер') || lower.includes('эффект')) {
        return "**Электроэпиляция** — это **единственный** метод удаления волос навсегда, официально признанный FDA! ⚡ В отличие от лазера, она убирает **любые** волосы: светлые, рыжие, седые и пушковые на 100%.";
      }
      if (lower.includes('зон') || lower.includes('бикини') || lower.includes('лиц') || lower.includes('подмыш')) {
        return "Мы бережно работаем **на всех зонах**: лицо (верхняя губа, подбородок), подмышки, ручки, ножки и **глубокое бикини** 🌸. Всё стерильно, безопасно и с заботой о вашей коже!";
      }
      if (lower.includes('как дела') || lower.includes('настроен')) {
        return "У меня всё просто чудесно! 🌸 Готова дарить красоту и гладкость. А как проходит ваш день?";
      }
      return "В студии **«Электромир»** мы удаляем волосы **навсегда** на любых зонах (лицо, тело, глубокое бикини) по стандарту FDA 🌸. Спросите меня про обезболивание, подготовку к процедуре или интересующую вас зону!";
    }

    async function fetchFromHF(url) {
      const response = await fetch(url, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json", 
          "Authorization": `Bearer ${HF_TOKEN}` 
        },
        body: JSON.stringify({ 
          model: "Qwen/Qwen2.5-72B-Instruct",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: window.lastUserText }
          ],
          max_tokens: 400,
          temperature: 0.7
        })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.choices?.[0]?.message?.content?.trim();
    }

    async function getAIResponse(text) {
      window.lastUserText = text;
      document.getElementById('typing-box').classList.remove('hidden');
      let aiText = "";

      try {
        // 1. Пробуем актуальный роутер Hugging Face
        aiText = await fetchFromHF(ROUTER_URL);
      } catch (e1) {
        try {
          // 2. Пробуем резервный эндпоинт Hugging Face
          aiText = await fetchFromHF(LEGACY_URL);
        } catch (e2) {
          // 3. Если токен отозван или лимит исчерпан — отвечает встроенная логика без ошибок!
          console.warn("HF API недоступен, включен встроенный режим консультанта:", e2);
          await new Promise(r => setTimeout(r, 600));
          aiText = getLocalAnswer(text);
        }
      }
