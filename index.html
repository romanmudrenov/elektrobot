<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромир Bot</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Nunito', sans-serif; background-color: #fdf2f8; color: #3b0764; }
    .font-brand { font-family: 'Comfortaa', cursive, sans-serif; }
    .bg-canvas {
      background: radial-gradient(circle at 10% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 40%),
                  radial-gradient(circle at 90% 85%, rgba(192, 132, 252, 0.25) 0%, transparent 50%),
                  #fdf2f8;
    }
    .bubble-bot {
      background: #ffffff;
      border: 1px solid rgba(244, 114, 182, 0.35);
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.05);
    }
    .bubble-user {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(219, 39, 119, 0.25);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 9999px; }
    
    @keyframes wavePulse {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .wave-bar {
      animation: wavePulse 0.8s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="bg-canvas h-[100dvh] flex flex-col justify-between overflow-hidden">

  <!-- ШАПКА -->
  <header class="bg-white/90 backdrop-blur-md border-b border-pink-200 px-3 py-2 flex items-center justify-between flex-shrink-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-pink-100 flex items-center justify-center text-lg border border-pink-300">⚡</div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-brand font-bold text-sm text-pink-950">Электромир Bot</h1>
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
        <p class="text-[10px] text-pink-800/60 font-semibold">Живой AI с нейроголосом</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <!-- Переключатель звука с анимацией волны речи -->
      <button id="voice-btn" onclick="toggleVoice()" class="px-2.5 py-1.5 rounded-xl bg-pink-100 text-pink-900 border border-pink-300 text-xs flex items-center gap-1.5 transition active:scale-95">
        <i data-lucide="volume-2" id="voice-icon" class="w-4 h-4 text-pink-600"></i>
        <div id="voice-wave" class="hidden flex items-center gap-0.5 h-3.5">
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar"></span>
        </div>
      </button>

      <button onclick="clearChat()" title="Очистить" class="p-2 rounded-xl text-pink-800 hover:bg-pink-100 transition">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ОКНО ЧАТА -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-2 flex flex-col min-h-0 z-10">
    <div class="bg-white/80 backdrop-blur-md rounded-3xl flex-1 flex flex-col min-h-0 border border-pink-200 shadow-lg overflow-hidden">
      
      <!-- Быстрые кнопки -->
      <div class="bg-pink-50/70 border-b border-pink-200/50 px-3 py-1.5 overflow-x-auto whitespace-nowrap flex gap-1.5 text-xs flex-shrink-0">
        <button onclick="sendQuick('Какие зоны электроэпиляции бывают?')" class="bg-white border border-pink-200 px-2.5 py-1 rounded-full text-pink-900 text-[11px] shadow-xs active:scale-95 transition">📍 Зоны обработки</button>
        <button onclick="sendQuick('Чем электро отличается от лазера?')" class="bg-white border border-pink-200 px-2.5 py-1 rounded-full text-pink-900 text-[11px] shadow-xs active:scale-95 transition">⚡ Лазер или Электро?</button>
        <button onclick="sendQuick('Это больно? Как вы обезболиваете?')" class="bg-white border border-pink-200 px-2.5 py-1 rounded-full text-pink-900 text-[11px] shadow-xs active:scale-95 transition">💉 Про боль</button>
        <button onclick="sendQuick('Расскажи шутку или подними настроение')" class="bg-white border border-pink-200 px-2.5 py-1 rounded-full text-pink-900 text-[11px] shadow-xs active:scale-95 transition">☕ Поболтать</button>
      </div>

      <!-- Лента сообщений -->
      <div id="chat-stream" class="flex-1 overflow-y-auto p-3.5 space-y-3 min-h-0">
        <div class="flex items-start gap-2 max-w-[88%]">
          <div class="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center text-sm flex-shrink-0 border border-pink-200">⚡</div>
          <div class="bubble-bot rounded-2xl rounded-tl-sm p-3.5 text-xs sm:text-sm text-pink-950">
            <span class="font-brand font-bold block mb-1">Приветствую в «Электромир»! 🌸</span>
            Я ваш виртуальный эксперт студии. Готова подробно ответить на любые вопросы о процедурах, обезболивании, зонах или просто поболтать по душам.
          </div>
        </div>
      </div>

      <!-- Индикатор набора текста -->
      <div id="typing-box" class="hidden px-4 py-1.5 flex items-center gap-1.5 text-xs text-pink-700/70">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
        <span>Печатает ответ...</span>
      </div>

      <!-- Поле ввода -->
      <div class="p-2 sm:p-2.5 bg-white border-t border-pink-200 flex-shrink-0">
        <form onsubmit="handleSend(event)" class="flex items-end gap-1.5">
          <textarea 
            id="user-input" 
            rows="1" 
            placeholder="Спросите о чём угодно..." 
            class="flex-1 resize-none max-h-24 bg-pink-50/50 border border-pink-300 rounded-2xl py-2.5 px-3 text-xs sm:text-sm text-pink-950 focus:outline-none focus:border-pink-500"
            onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();handleSend(event);}"
          ></textarea>
          <button type="submit" id="send-btn" class="h-10 w-10 rounded-2xl bg-pink-600 hover:bg-pink-700 active:scale-95 text-white flex items-center justify-center shadow-md transition flex-shrink-0">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();

    let isVoiceActive = true;
    let currentAudio = null;

    const SYSTEM_PROMPT = `Ты — живая, вежливая, деликатная и остроумная девушка-консультант студии электроэпиляции «Электромир».
ТВОИ ПРАВИЛА:
1. Отвечай живым, человеческим языком, без роботизированных штампов.
2. Про зоны: электроэпиляция работает НА ЛЮБЫХ ЗОНАХ (лицо: усики, подбородок, брови; тело: подмышки, ареолы, живот, руки, ноги; бикини: классика и тотальное глубокое).
3. Электроэпиляция — единственный в мире способ удаления навсегда (стандарт FDA Permanent Hair Removal). Лазер — временное уменьшение.
4. Если грубят — отвечай с юмором, шутя про силу тока, сопротивление и перегоревшие предохранители.
5. Не делай ответы слишком громоздкими — пиши емко, структурированно, выделяя важное жирным шрифтом.`;

    const chatHistory = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    // ==========================================
    // НЕЙРОСЕТЕВОЙ API (БЕЗ КЛЮЧЕЙ И ОГРАНИЧЕНИЙ)
    // ==========================================
    async function fetchAiResponse(userText) {
      chatHistory.push({ role: "user", content: userText });

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: chatHistory,
            model: "openai",
            seed: Math.floor(Math.random() * 1000000)
          })
        });

        if (!response.ok) throw new Error("Сетевая ошибка API");
        const replyText = await response.text();

        chatHistory.push({ role: "assistant", content: replyText });
        return replyText;
      } catch (err) {
        console.warn("Сбой сети, ответ из локального реестра:", err);
        if (userText.toLowerCase().includes("зон")) {
          return "Мы филигранно работаем со всеми зонами:\n\n* **Лицо:** усики над губой, подбородок, брови, виски.\n* **Тело:** подмышки, руки, ноги, белая линия живота, ареолы груди.\n* **Бикини:** по линии белья и тотальное глубокое бикини.\n\nЭлектроэпиляция удаляет любой тип волос навсегда без риска врастания!";
        }
        return "Секундочку, прервался сигнал. Повторите, пожалуйста, ваш вопрос!";
      }
    }

    // ==========================================
    // ЖИВОЙ НЕЙРОСЕТЕВОЙ ГОЛОС (OPENAI NOVA)
    // ==========================================
    async function speak(text) {
      if (!isVoiceActive) return;

      // Остановка предыдущего звука
      stopSpeech();

      // Очистка от спецсимволов разметки
      const clean = text
        .replace(/[*_#`~>\[\]\(\)]/g, '')
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .trim();

      if (!clean) return;

      const wave = document.getElementById('voice-wave');
      // Берем первые 2-3 предложения для быстрой плавной генерации
      const speechSegment = clean.length > 250 ? clean.substring(0, 250) + "..." : clean;

      try {
        wave.classList.remove('hidden');

        // Запрос женского нейроголоса Nova через OpenAI Audio TTS
        const encodedPrompt = encodeURIComponent(speechSegment);
        const audioUrl = `https://text.pollinations.ai/${encodedPrompt}?model=openai-audio&voice=nova`;

        currentAudio = new Audio(audioUrl);

        currentAudio.onended = () => wave.classList.add('hidden');
        currentAudio.onerror = () => {
          wave.classList.add('hidden');
          fallbackBrowserSpeech(speechSegment);
        };

        await currentAudio.play();
      } catch (err) {
        wave.classList.add('hidden');
        fallbackBrowserSpeech(speechSegment);
      }
    }

    function fallbackBrowserSpeech(cleanText) {
      if (!('speechSynthesis' in window) || !isVoiceActive) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(cleanText);
      utt.lang = 'ru-RU';
      utt.rate = 1.0;
      utt.pitch = 1.18;

      const voices = window.speechSynthesis.getVoices();
      const female = voices.find(v => v.lang.startsWith('ru') && /milena|alisa|svetlana|irina|google|tatiana/i.test(v.name));
      if (female) utt.voice = female;

      window.speechSynthesis.speak(utt);
    }

    function stopSpeech() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('voice-wave').classList.add('hidden');
    }

    function toggleVoice() {
      isVoiceActive = !isVoiceActive;
      const icon = document.getElementById('voice-icon');
      icon.className = isVoiceActive ? 'w-4 h-4 text-pink-600' : 'w-4 h-4 text-slate-400';
      if (!isVoiceActive) {
        stopSpeech();
      }
    }

    // ==========================================
    // ЛОГИКА ДИАЛОГА И DOM
    // ==========================================
    function appendMsg(role, text) {
      const stream = document.getElementById('chat-stream');
      const isUser = role === 'user';
      const div = document.createElement('div');
      div.className = `flex items-start gap-2 ${isUser ? 'justify-end' : 'justify-start'}`;

      if (isUser) {
        div.innerHTML = `
          <div class="bubble-user rounded-2xl rounded-tr-sm px-3.5 py-2 text-xs sm:text-sm max-w-[85%] whitespace-pre-wrap">
            ${text.replace(/</g, "&lt;")}
          </div>
        `;
      } else {
        div.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center text-sm flex-shrink-0 border border-pink-200">⚡</div>
          <div class="bubble-bot rounded-2xl rounded-tl-sm p-3.5 text-xs sm:text-sm text-pink-950 max-w-[88%] leading-relaxed">
            ${marked.parse(text)}
          </div>
        `;
      }

      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      stopSpeech();

      appendMsg('user', text);
      input.value = '';
      input.disabled = true;

      const typing = document.getElementById('typing-box');
      typing.classList.remove('hidden');

      const answer = await fetchAiResponse(text);
      
      typing.classList.add('hidden');
      input.disabled = false;
      input.focus();

      appendMsg('bot', answer);
      speak(answer);
    }

    function sendQuick(t) {
      document.getElementById('user-input').value = t;
      handleSend();
    }

    function clearChat() {
      stopSpeech();
      chatHistory.length = 1;
      document.getElementById('chat-stream').innerHTML = `
        <div class="flex items-start gap-2 max-w-[88%]">
          <div class="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center text-sm flex-shrink-0 border border-pink-200">⚡</div>
          <div class="bubble-bot rounded-2xl rounded-tl-sm p-3.5 text-xs text-pink-950">
            История очищена. О чем хотите поговорить? 🌸
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
