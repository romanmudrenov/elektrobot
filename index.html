<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромир Bot (No Voice)</title>
  <style>
    /* --- СТИЛИ (Clean Design) --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 10% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 40%),
                  radial-gradient(circle at 90% 85%, rgba(192, 132, 252, 0.25) 0%, transparent 50%),
                  #fdf2f8;
      color: #4a044e;
      height: 100vh;
      height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: #ffffff; border-bottom: 1px solid #fbcfe8;
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: #fce7f3; border: 1px solid #f9a8d4;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .title { font-weight: 800; font-size: 15px; color: #500724; }
    .subtitle { font-size: 11px; color: #9d174d; font-weight: 600; }
    .icon-btn {
      background: #fce7f3; border: 1px solid #f9a8d4; color: #831843;
      border-radius: 10px; padding: 6px 10px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      transition: background 0.2s;
    }
    .icon-btn:active { background: #fbcfe8; }
    main {
      flex: 1; max-width: 680px; width: 100%; margin: 0 auto;
      padding: 10px; display: flex; flex-direction: column; min-height: 0;
    }
    .chat-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #fbcfe8; border-radius: 20px;
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.08);
    }
    #chat-stream {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg-row-bot { display: flex; align-items: flex-start; gap: 8px; max-width: 88%; }
    .msg-row-user { display: flex; justify-content: flex-end; }
    .bot-avatar {
      width: 32px; height: 32px; border-radius: 10px;
      background: #fce7f3; border: 1px solid #fbcfe8;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .bubble-bot {
      background: #ffffff; border: 1px solid #f9a8d4;
      border-radius: 16px; border-top-left-radius: 4px;
      padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #500724;
      word-wrap: break-word;
    }
    .bubble-user {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #ffffff; border-radius: 16px; border-top-right-radius: 4px;
      padding: 12px 14px; font-size: 14px; line-height: 1.45; max-width: 85%;
      word-wrap: break-word;
    }
    #typing-box {
      padding: 6px 16px; font-size: 12px; color: #be185d;
      display: none; align-items: center; gap: 6px; font-weight: 600;
    }
    .quick-bar {
      padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto;
      background: #fdf2f8; border-top: 1px solid #fce7f3; flex-shrink: 0;
    }
    .quick-bar::-webkit-scrollbar { height: 4px; }
    .quick-bar::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 999px;
      background: #ffffff; border: 1px solid #f9a8d4;
      font-size: 12px; color: #831843; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { background: #fce7f3; }
    .input-area {
      padding: 10px; background: #ffffff; border-top: 1px solid #fbcfe8; flex-shrink: 0;
    }
    .input-form { display: flex; align-items: center; gap: 8px; }
    #user-input {
      flex: 1; background: #fdf2f8;
      border: 1px solid #f9a8d4; border-radius: 14px;
      padding: 10px 14px; font-size: 14px; color: #500724;
      outline: none; font-family: inherit;
    }
    #user-input:focus { border-color: #ec4899; background: #ffffff; }
    .send-btn {
      width: 44px; height: 42px; border-radius: 14px;
      background: #db2777; color: #ffffff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-size: 16px; transition: background 0.2s;
    }
    .send-btn:hover { background: #be185d; }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="title">Электромир Bot</div>
        <div class="subtitle">AI Консультант (Без звука)</div>
      </div>
    </div>
    <div class="header-btns">
      <button type="button" class="icon-btn" id="reload-btn" title="Сбросить диалог">🔄 Заново</button>
    </div>
  </header>

  <main>
    <div class="chat-card">
      <div id="chat-stream">
        <div class="msg-row-bot">
          <div class="bot-avatar">⚡</div>
          <div class="bubble-bot">
            Привет! Я консультант <b>«Электромира»</b> 🌸. С удовольствием отвечу на любые вопросы про электроэпиляцию (цены, боль, подготовка). Спрашивайте!
          </div>
        </div>
      </div>

      <div id="typing-box">⏳ Печатаю ответ...</div>

      <div class="quick-bar" id="quick-bar">
        <button type="button" class="chip" data-q="Это больно?">🌸 Ощущения</button>
        <button type="button" class="chip" data-q="Сколько стоит?">💳 Цены</button>
        <button type="button" class="chip" data-q="Точно навсегда?">⚡ Гарантия</button>
        <button type="button" class="chip" data-q="Зоны и бикини">✨ Зоны</button>
        <button type="button" class="chip" data-q="Запишите меня">✍️ Запись</button>
      </div>

      <div class="input-area">
        <form id="chat-form" class="input-form">
          <input type="text" id="user-input" placeholder="Напишите вопрос..." autocomplete="off">
          <button type="submit" class="send-btn">➤</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // --- КОНФИГУРАЦИЯ ---
      var HF_TOKEN = "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"; 
      var SYSTEM_PROMPT = "Ты — дружелюбный администратор студии «Электромир». Твоя цель — проконсультировать и записать клиента. \n1. ФАКТ: Электроэпиляция — единственный метод удаления волос НАВСЕГДА (FDA).\n2. ФАКТ: Мы делаем ВСЕ зоны (бикини, лицо, тело).\n3. СТИЛЬ: Отвечай кратко (2-3 предложения), используй разные формулировки, не повторяйся. Используй эмодзи (🌸, ✨, ⚡). Если спрашивают цену, предлагай записаться.";
      
      // История сообщений (храним контекст)
      var chatHistory = []; 
      // Запоминаем последний использованный локальный ответ, чтобы не повторять
      var lastLocalReplyIndex = -1;

      // Элементы
      var chatStream = document.getElementById("chat-stream");
      var typingBox = document.getElementById("typing-box");
      var chatForm = document.getElementById("chat-form");
      var userInput = document.getElementById("user-input");
      var reloadBtn = document.getElementById("reload-btn");
      var quickBar = document.getElementById("quick-bar");

      function formatHTML(str) {
        return String(str || "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
          .replace(/\n/g, "<br>");
      }

      // Функция для получения случайного элемента, исключая повторы
      function getUniqueRandomReply(repliesArray) {
        if (!repliesArray || repliesArray.length === 0) return null;
        // Пробуем найти ответ, отличный от предыдущего
        var attempts = 0;
        var reply = "";
        do {
           reply = repliesArray[Math.floor(Math.random() * repliesArray.length)];
           attempts++;
        } while (reply === window.lastReply && attempts < 3);
        
        window.lastReply = reply;
        return reply;
      }

      // --- ЛОКАЛЬНАЯ БАЗА (Мгновенные ответы) ---
      function getLocalReply(text) {
        var t = text.toLowerCase();
        
        if (t.includes("бол") || t.includes("ощущ")) {
          return getUniqueRandomReply([
            "Всё очень индивидуально, но вполне терпимо! 🌸 Мы используем качественную анестезию, поэтому многие клиенты даже отдыхают во время процедуры.",
            "Не переживайте! Ощущения похожи на легкое покалывание или тепло. Для нежных зон (бикини) у нас есть специальные кремы-анестетики. ✨",
            "Больно не будет! ⚡ Современные аппараты работают очень деликатно. Большинство девушек говорят, что шугаринг был больнее."
          ]);
        }
        
        if (t.includes("цен") || t.includes("стои") || t.includes("прайс")) {
          return getUniqueRandomReply([
            "У нас честная поминутная тарификация 💳: тело — **35 ₽/мин**, бикини — **40 ₽/мин**. Вы платите только за время работы мастера.",
            "Прайс прозрачный: минута работы стоит от 35 рублей. Плюс 150 ₽ за вашу личную стерильную иголочку. Записать вас на пробный сеанс? 🌸",
            "Стоимость зависит от количества волос. Чем больше процедур вы сделаете, тем меньше волос останется и тем дешевле будет сеанс! Начальная цена — 35 ₽/мин. ✨"
          ]);
        }
        
        if (t.includes("навсегда") || t.includes("гарант") || t.includes("вернет")) {
          return getUniqueRandomReply([
            "Да, это навсегда! ⚡ Электроэпиляция — единственный метод в мире, официально признанный FDA как перманентное удаление волос.",
            "Абсолютно точно. Мы убиваем ростковую зону волоса, и он больше физически не может вырасти. Это гарантия 100%. 🌸",
            "В отличие от лазера, здесь волос удаляется раз и навсегда. Пройдя курс, вы забудете о бритве на всю оставшуюся жизнь. ✨"
          ]);
        }

        if (t.includes("зон") || t.includes("бикини") || t.includes("лиц")) {
          return getUniqueRandomReply([
            "Мы работаем со всеми зонами! Ножки, ручки, подмышки, глубокое бикини и лицо. ✨",
            "Делаем всё: от усиков над губой до пальчиков на ногах. Ограничений практически нет (кроме внутренней части ушей и носа). 🌸",
            "Любая зона на ваш выбор! Кстати, бикини — наша самая популярная процедура. Мастера очень деликатны. Запишемся? ⚡"
          ]);
        }
        
        return null;
      }

      // --- УМНЫЙ ЗАПРОС К API ---
      async function fetchSmartResponse(userText) {
        // 1. Попробуем найти быстрый ответ в базе
        // (С вероятностью 50% мы пропустим базу, чтобы дать слово ИИ для разнообразия)
        var localRep = getLocalReply(userText);
        if (localRep && Math.random() > 0.5) {
           await new Promise(function(r) { setTimeout(r, 600); }); // Имитация печати
           // Сохраняем в историю и локальный ответ тоже
           chatHistory.push({ role: "user", content: userText });
           chatHistory.push({ role: "assistant", content: localRep });
           return localRep;
        }

        // 2. Если базы нет или пропустили -> идем в API с КОНТЕКСТОМ
        
        // Добавляем текущий вопрос в историю
        chatHistory.push({ role: "user", content: userText });

        // Формируем пакет сообщений (System + последние 8 сообщений)
        var messagesPayload = [{ role: "system", content: SYSTEM_PROMPT }].concat(chatHistory.slice(-8));

        try {
          var response = await fetch("https://huggingface.co", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + HF_TOKEN,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "Qwen/Qwen2.5-72B-Instruct", // Мощная модель
              messages: messagesPayload,
              max_tokens: 200,
              temperature: 0.85, // Высокая температура для креативности
              top_p: 0.9
            })
          });

          if (!response.ok) throw new Error("API Error");
          var data = await response.json();
          var aiText = "";

          // Парсинг ответа
          if (data.choices && data.choices[0]) {
             aiText = data.choices[0].message.content.trim();
          } else {
             aiText = "Извините, я немного задумалась. Повторите вопрос? 🌸";
          }

          // Добавляем ответ ИИ в историю
          chatHistory.push({ role: "assistant", content: aiText });
          return aiText;

        } catch (err) {
          console.warn("AI Error, using fallback:", err);
          return localRep || "Что-то с интернетом, но я всё равно готова вас записать! Напишите нам в WhatsApp? 🌸";
        }
      }

      // --- UI ЛОГИКА ---
      function appendMessage(text, isUser) {
        var row = document.createElement("div");
        row.className = isUser ? "msg-row-user" : "msg-row-bot";
        
        var bubble = document.createElement("div");
        bubble.className = isUser ? "bubble-user" : "bubble-bot";
        bubble.innerHTML = formatHTML(text);
        
        if (!isUser) {
          var avatar = document.createElement("div");
          avatar.className = "bot-avatar";
          avatar.textContent = "⚡";
          row.appendChild(avatar);
        }
        
        row.appendChild(bubble);
        chatStream.appendChild(row);
        chatStream.scrollTop = chatStream.scrollHeight;
      }

      async function handleSend(text) {
        var query = String(text || "").trim();
        if (!query) return;

        userInput.value = "";
        appendMessage(query, true);

        typingBox.style.display = "flex";
        chatStream.scrollTop = chatStream.scrollHeight;

        var reply = await fetchSmartResponse(query);

        typingBox.style.display = "none";
        appendMessage(reply, false);
      }

      // Обработчики
      chatForm.addEventListener("submit", function(e) { e.preventDefault(); handleSend(userInput.value); });
      
      quickBar.addEventListener("click", function(e) {
        if (e.target.classList.contains("chip")) handleSend(e.target.getAttribute("data-q"));
      });

      reloadBtn.addEventListener("click", function() {
        chatStream.innerHTML = "";
        chatHistory = []; // Полный сброс памяти
        appendMessage("Привет! Я консультант <b>«Электромира»</b> 🌸. С удовольствием отвечу на любые вопросы про электроэпиляцию (цены, боль, подготовка). Спрашивайте!", false);
      });

    })();
  </script>
</body>
</html>
