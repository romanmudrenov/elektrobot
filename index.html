<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Электромир Bot</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; 
      background-color: #fdf2f8; 
      color: #3b0764; 
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .font-brand { font-family: 'Comfortaa', cursive, sans-serif; }
    .bg-canvas { 
      background: radial-gradient(circle at 10% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 40%), 
                  radial-gradient(circle at 90% 85%, rgba(192, 132, 252, 0.25) 0%, transparent 50%), 
                  #fdf2f8; 
    }
    .bubble-bot { 
      background: #ffffff; 
      border: 1px solid rgba(244, 114, 182, 0.35); 
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.05); 
      line-height: 1.45;
    }
    .bubble-user { 
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); 
      color: #ffffff; 
      box-shadow: 0 4px 14px rgba(219, 39, 119, 0.25); 
      line-height: 1.45;
    }
    .wave-bar { animation: wavePulse 0.8s ease-in-out infinite; }
    @keyframes wavePulse { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 9999px; }
  </style>
</head>
<body class="bg-canvas h-[100dvh] flex flex-col justify-between overflow-hidden">

  <!-- Шапка -->
  <header class="bg-white/90 backdrop-blur-md border-b border-pink-200 px-3 py-2 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-pink-100 flex items-center justify-center text-lg border border-pink-300">⚡</div>
      <div>
        <h1 class="font-brand font-bold text-sm text-pink-950 m-0">Электромир Bot</h1>
        <p class="text-[10px] text-pink-800/60 font-semibold m-0">AI Консультант + Голос Ирины</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button type="button" onclick="toggleVoice()" id="voice-btn" class="px-2.5 py-1.5 rounded-xl bg-pink-100 text-pink-900 border border-pink-300 text-xs flex items-center gap-1.5 active:scale-95 transition cursor-pointer">
        <!-- Встроенная SVG иконка звука -->
        <svg id="voice-icon" class="w-4 h-4 text-pink-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <div id="voice-wave" class="hidden flex items-center gap-0.5 h-3.5">
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar" style="animation-delay:0.2s"></span>
          <span class="w-0.5 bg-pink-600 rounded-full wave-bar" style="animation-delay:0.4s"></span>
        </div>
      </button>
      <button type="button" onclick="location.reload()" class="p-2 rounded-xl text-pink-800 hover:bg-pink-100 transition cursor-pointer" title="Перезагрузить чат">
        <!-- Встроенная SVG иконка обновления -->
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Основное окно чата -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-2 flex flex-col min-h-0 z-10">
    <div class="bg-white/80 backdrop-blur-md rounded-3xl flex-1 flex flex-col border border-pink-200 shadow-lg overflow-hidden min-h-0">
      
      <!-- Лента сообщений -->
      <div id="chat-stream" class="flex-1 overflow-y-auto p-3.5 space-y-4">
        <div class="flex items-start gap-2 max-w-[88%]">
          <div class="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center text-sm border border-pink-200 shrink-0">⚡</div>
          <div class="bubble-bot rounded-2xl rounded-tl-sm p-3.5 text-xs sm:text-sm text-pink-950">
            Привет! Я помощница из <b>«Электромира»</b> 🌸. Готова рассказать всё об электроэпиляции или просто поболтать о жизни. Что вас интересует?
          </div>
        </div>
      </div>

      <!-- Индикатор набора -->
      <div id="typing-box" class="hidden px-4 py-1.5 flex items-center gap-1.5 text-xs text-pink-700/70">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
        <span>Печатаю ответ...</span>
      </div>

      <!-- Быстрые кнопки для удобной проверки -->
      <div class="px-3 py-1.5 flex gap-1.5 overflow-x-auto bg-pink-50/40 border-t border-pink-100">
        <button type="button" onclick="quickAsk('Это больно?')" class="shrink-0 px-3 py-1 rounded-full bg-white border border-pink-200 text-[11px] text-pink-900 hover:bg-pink-100 transition cursor-pointer">🌸 Это больно?</button>
        <button type="button" onclick="quickAsk('Сколько стоит?')" class="shrink-0 px-3 py-1 rounded-full bg-white border border-pink-200 text-[11px] text-pink-900 hover:bg-pink-100 transition cursor-pointer">💳 Цены</button>
        <button type="button" onclick="quickAsk('Удаляет навсегда?')" class="shrink-0 px-3 py-1 rounded-full bg-white border border-pink-200 text-[11px] text-pink-900 hover:bg-pink-100 transition cursor-pointer">⚡ Навсегда?</button>
        <button type="button" onclick="quickAsk('На каких зонах делаете?')" class="shrink-0 px-3 py-1 rounded-full bg-white border border-pink-200 text-[11px] text-pink-900 hover:bg-pink-100 transition cursor-pointer">✨ Зоны</button>
      </div>

      <!-- Форма отправки -->
      <div class="p-2 sm:p-2.5 bg-white border-t border-pink-200">
        <form id="chat-form" class="flex items-end gap-1.5 m-0">
          <textarea id="user-input" rows="1" placeholder="Спросите меня о чём угодно..." class="flex-1 resize-none bg-pink-50/50 border border-pink-300 rounded-2xl py-2.5 px-3 text-xs sm:text-sm text-pink-950 focus:outline-none focus:border-pink-500"></textarea>
          <button type="submit" class="h-10 w-10 rounded-2xl bg-pink-600 text-white flex items-center justify-center shadow-md active:scale-95 transition shrink-0 cursor-pointer border-0">
            <!-- Встроенная SVG иконка отправки -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const HF_TOKEN = "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";
    const ROUTER_URL = "https://huggingface.co";
    const LEGACY_URL = "https://huggingface.co";
    
    const SYSTEM_PROMPT = `Ты — живая, вежливая и экспертная девушка-консультант студии «Электромир».
    1. Электроэпиляция — ЕДИНСТВЕННЫЙ метод удаления волос НАВСЕГДА (стандарт FDA).
    2. Мы работаем на ВСЕХ зонах (лицо, тело, глубокое бикини).
    3. Отвечай кратко, используй эмодзи 🌸, выделяй важное жирным шрифтом.
    4. Если спрашивают не про волосы — поддерживай диалог как милая подруга.`;

    let isVoiceActive = true;
    const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

    // Встроенный форматировщик текста (не требует внешних библиотек)
    function formatMessage(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/\*(.*?)\*/g, "<i>$1</i>")
        .replace(/\n/g, "<br>");
    }

    function getVoice() {
      if (!synth) return null;
      const voices = synth.getVoices();
      return voices.find(v => v.lang && v.lang.includes('ru') && (v.name.includes('Irina') || v.name.includes('Elena') || v.name.includes('Google'))) 
          || voices.find(v => v.lang && v.lang.includes('ru'));
    }

    function speak(text) {
      if (!isVoiceActive || !synth) return;
      try {
        synth.cancel();
        const cleanText = text.replace(/[#*_~`>]/g, '').substring(0, 250);
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voice = getVoice();
        if (voice) utterance.voice = voice;
        utterance.lang = 'ru-RU';
        utterance.rate = 1.0;
        const wave = document.getElementById('voice-wave');
        if (wave) wave.classList.remove('hidden');
        utterance.onend = () => { if (wave) wave.classList.add('hidden'); };
        utterance.onerror = () => { if (wave) wave.classList.add('hidden'); };
        synth.speak(utterance);
      } catch (err) {
        console.warn("Озвучка недоступна:", err);
      }
    }

    function getLocalAnswer(q) {
      const lower = q.toLowerCase();
      if (lower.includes('привет') || lower.includes('здравств')) {
        return "Привет-привет! 🌸 Очень рада вас видеть! Рассказать вам, как избавиться от лишних волосков **навсегда**, или просто поболтаем?";
      }
      if (lower.includes('больно') || lower.includes('боль') || lower.includes('обезбол')) {
